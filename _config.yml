title: Phases, Forms, & Flows Lab
tagline: Welcome to the PFFL! We are located in the Mechanical Engineering Department at IIT KGP. 
description: An experimental lab with a particular interest in physicochemical hydrodynamical phenomena. The goal is to push the <i>usual study</i> of multiphase, multicomponent, and multiscalar soft matter systems into <i>unusual territories</i> to understand patterns, structures, functions, and dynamics in a wide range of natural and artificial systems. 
