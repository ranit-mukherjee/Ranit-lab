title: MorphoFluidics Lab
tagline: Welcome to the MorphoFluidics Lab! We are located in the Mechanical Engineering Department at IIT KGP. 
description: Ours is essentially an experimental soft matter lab with a particular interest in physicochemical hydrodynamical phenomena in natural systems. The real systems are most often messy, with many interdependent parts. By working with their engineered analogs, we try to identify and isolate the key controlling mechanisms. The goal is to push the usual study of multiphase, multicompnent fluidic systems into uncharted territories, freezing in granular medium, organ morphology, cellular functions, among others.
