title: MorphoFluidics Lab
tagline: Welcome to the MorphoFluidics Lab! We are located in the Mechanical Engineering Department at IIT KGP. 
description: An experimental soft matter lab with a particular interest in physicochemical hydrodynamical phenomena in natural systems. The goal is to push the <i>usual study</i> of multiphase, multicompnent fluidic systems into <i>unusual territories<\i>, e.g., the intricacies of tissue freezing, generic principles of organ morphogenesis, or create tiny bioreactors for basic cellular function studies.
