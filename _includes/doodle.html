{% comment %} Usage: {% include doodle.html file="cat.svg" right="4%" top="200px" w=160 rotate=-6 %}  (file lives in /doodles/) {% endcomment %}
<img class="doodle" src="{{ '/doodles/' | append: include.file | relative_url }}" alt="" aria-hidden="true" style="width:{{ include.w | default: 180 }}px;{% if include.top %}top:{{ include.top }};{% endif %}{% if include.bottom %}bottom:{{ include.bottom }};{% endif %}{% if include.left %}left:{{ include.left }};{% endif %}{% if include.right %}right:{{ include.right }};{% endif %}{% if include.rotate %}transform:rotate({{ include.rotate }}deg);{% endif %}">
