{% assign parts = site.title | split: "-" %}
<header><div class="wrap">
  <a class="logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}"><span>{{ parts[0] }}</span>{% if parts[1] %}<span>{{ parts[1] }}</span>{% endif %}</a>
  <nav>{% for l in site.data.nav %}<a href="{{ l.url | relative_url }}"{% if page.url contains l.url %} class="on"{% endif %}>{{ l.title }}</a>{% endfor %}</nav>
</div></header>
